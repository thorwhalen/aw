[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "aw"
version = "0.1.6"
description = "AI Agentic Workflows for data preparation and transformation"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "ai",
    "agents",
    "agentic-workflows",
    "data-preparation",
    "llm",
    "react-pattern",
    "pandas",
    "dataframe",
    "cosmograph",
    "visualization",
    "code-execution",
    "validation",
    "orchestration",
    "claude-desktop",
    "mcp",
]
authors = [
    { name = "Thor Whalen" },
]
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas",
    "config2py",
    "pydantic",
    "oa",
]

[project.urls]
Homepage = "https://thorwhalen.github.io/aw/"
Repository = "https://github.com/thorwhalen/aw"
Issues = "https://github.com/thorwhalen/aw/issues"
Changelog = "https://github.com/thorwhalen/aw/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = [
    "openai",
    "oa",
]
cosmograph = [
    "cosmograph",
]
langchain = [
    "langchain",
    "langchain-experimental",
]
all = [
    "openai",
    "oa",
    "cosmograph",
    "langchain",
    "langchain-experimental",
]
testing = [
    "pytest",
    "pytest-cov",
    "openai",
    "oa",
]

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = [
    "**/*.ipynb",
    ".git",
    ".venv",
    "build",
    "dist",
    "tests",
    "examples",
    "scrap",
]

[tool.ruff.lint]
select = [
    "D100",
]
ignore = [
    "D203",
    "E501",
    "B905",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = [
    "D",
]
"**/examples/*" = [
    "D",
]
"**/scrap/*" = [
    "D",
]

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = [
    "tests",
]
doctest_optionflags = [
    "NORMALIZE_WHITESPACE",
    "ELLIPSIS",
]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.commands]
pre_test = []
test = []
post_test = []
lint = []
format = []

[tool.wads.ci.env]
required_envvars = []
# OPENAI_API_KEY: aw modules read this via config2py at import time.
# wads-migrate wires this from secrets into the workflow-level env: block.
test_envvars = ["OPENAI_API_KEY"]
extra_envvars = []

[tool.wads.ci.env.defaults]

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.quality.black]
enabled = false

[tool.wads.ci.quality.mypy]
enabled = false

[tool.wads.ci.testing]
python_versions = [
    "3.10",
    "3.12",
]
pytest_args = [
    "-v",
    "--tb=short",
]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = [
    "term",
    "xml",
]
exclude_paths = [
    "examples",
    "scrap",
]
test_on_windows = true

[tool.wads.ci.metrics]
enabled = true
config_path = ".github/umpyre-config.yml"
storage_branch = "code-metrics"
python_version = "3.10"
force_run = false

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
ignore_paths = [
    "tests/",
    "scrap/",
    "examples/",
]

